<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Debugg — Submissions</title>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    .filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
    .sfil{padding:6px 14px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:'Cabinet Grotesk',sans-serif;transition:all var(--t-fast)}
    .sfil.active,.sfil:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,245,255,.05)}
    .search-inp{flex:1;min-width:160px;padding:7px 13px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-family:'Cabinet Grotesk',sans-serif;outline:none}
    .search-inp:focus{border-color:var(--cyan)}
    .sub-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden}
    .sub-header{display:grid;grid-template-columns:160px 1fr 100px 80px 130px;padding:11px 20px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
    .sub-row{display:grid;grid-template-columns:160px 1fr 100px 80px 130px;padding:13px 20px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;transition:background var(--t-fast)}
    .sub-row:last-child{border-bottom:none}.sub-row:hover{background:var(--surface2)}
    .sub-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3)}
    .sub-prob a{color:var(--text);font-size:14px;font-weight:600;text-decoration:none}
    .sub-prob a:hover{color:var(--cyan)}
    .sub-lang{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text3)}
    .sub-tc{font-size:12px;color:var(--text3)}
    .empty-row{padding:48px;text-align:center;color:var(--text3);font-size:14px}
    .load-row{padding:40px;text-align:center;color:var(--text3);font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px}
    /* Detail modal */
    .detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
    .detail-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px}
    .detail-lbl{font-size:11px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
    .detail-val{font-size:14px;font-weight:700}
    pre.code-view{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.65;overflow-x:auto;white-space:pre-wrap;color:var(--text);max-height:360px;overflow-y:auto}
    @media(max-width:700px){.sub-header,.sub-row{grid-template-columns:1fr 90px 120px}.sub-header>*:nth-child(3),.sub-header>*:nth-child(4),.sub-row>*:nth-child(3),.sub-row>*:nth-child(4){display:none}}
  </style>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="dashboard.html">Debugg</a>
  <a class="nav-link" href="dashboard.html">Problems</a>
  <a class="nav-link active" href="submissions.html">Submissions</a>
  <a class="nav-link" href="discuss.html">Discuss</a>
  <a class="nav-link" href="playground.html">Playground</a>
  <div class="nav-spacer"></div>
  <button class="nav-icon-btn theme-btn" id="themeBtn">☀️</button>
  <a class="nav-avatar" href="profile.html" id="avatarBtn">D</a>
</nav>
<div class="page-wrap">
  <div class="section-title fade-up">My Submissions</div>
  <div class="filters fade-up fade-up-1">
    <button class="sfil active" data-s="All">All</button>
    <button class="sfil" data-s="Accepted">Accepted</button>
    <button class="sfil" data-s="Wrong Answer">Wrong Answer</button>
    <input class="search-inp" id="searchBox" placeholder="Search by problem name…"/>
  </div>
  <div class="sub-table fade-up fade-up-2" id="subTable">
    <div class="sub-header"><span>Time</span><span>Problem</span><span>Language</span><span>Tests</span><span>Status</span></div>
    <div class="load-row"><span class="spinner"></span> Loading…</div>
  </div>
</div>
<!-- Detail Modal -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal modal-wide">
    <button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('open')">✕</button>
    <h2 class="modal-title" id="mProbTitle">Submission</h2>
    <div class="detail-grid">
      <div class="detail-item"><div class="detail-lbl">Status</div><div class="detail-val" id="mStatus"></div></div>
      <div class="detail-item"><div class="detail-lbl">Language</div><div class="detail-val" id="mLang"></div></div>
      <div class="detail-item"><div class="detail-lbl">Tests Passed</div><div class="detail-val" id="mTests"></div></div>
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Submitted Code</div>
    <pre class="code-view" id="mCode"></pre>
  </div>
</div>
<script type="module">
import{auth,db}from'./firebase-config.js';
import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{collection,getDocs,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import{initTheme,toggleTheme}from'./theme.js';
initTheme();document.getElementById('themeBtn').addEventListener('click',toggleTheme);
let all=[],activeS='All';
onAuthStateChanged(auth,async user=>{
  if(!user){window.location.href='index.html';return;}
  document.getElementById('avatarBtn').textContent=(user.displayName||'D').split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
  try{const s=await getDocs(query(collection(db,'users',user.uid,'submissions'),orderBy('createdAt','desc')));all=s.docs.map(d=>({id:d.id,...d.data()}));render();}
  catch(e){document.getElementById('subTable').innerHTML='<div class="sub-header"><span>Time</span><span>Problem</span><span>Language</span><span>Tests</span><span>Status</span></div><div class="empty-row">Failed to load.</div>';}
});
function render(){
  const q=document.getElementById('searchBox').value.toLowerCase();
  const f=all.filter(s=>{if(activeS!=='All'&&s.status!==activeS)return false;if(q&&!((s.problemTitle||'').toLowerCase().includes(q)))return false;return true;});
  const h='<div class="sub-header"><span>Time</span><span>Problem</span><span>Language</span><span>Tests</span><span>Status</span></div>';
  if(!f.length){document.getElementById('subTable').innerHTML=h+'<div class="empty-row">No submissions found.</div>';return;}
  document.getElementById('subTable').innerHTML=h+f.map((s,i)=>{
    const t=s.createdAt?new Date(s.createdAt.seconds*1000).toLocaleString():'—';
    const sk=(s.status||'').replace(/\s+/g,'');
    return`<div class="sub-row" data-i="${i}"><span class="sub-time">${t}</span><span class="sub-prob"><a href="solve.html?id=${s.problemId||''}">${esc(s.problemTitle||s.problemId||'Unknown')}</a></span><span class="sub-lang">${s.language||'—'}</span><span class="sub-tc">${s.passed??'—'}/${s.total??'—'}</span><span><span class="badge badge-${sk==='Accepted'?'accepted':'wrong'}">${esc(s.status||'—')}</span></span></div>`;
  }).join('');
  document.querySelectorAll('.sub-row').forEach((row,i)=>{row.addEventListener('click',e=>{if(e.target.tagName==='A')return;openDetail(f[i]);});});
}
function openDetail(s){
  document.getElementById('mProbTitle').textContent=s.problemTitle||'Submission';
  const sk=(s.status||'').replace(/\s+/g,'');
  document.getElementById('mStatus').innerHTML=`<span class="badge badge-${sk==='Accepted'?'accepted':'wrong'}">${esc(s.status||'—')}</span>`;
  document.getElementById('mLang').textContent=s.language||'—';
  document.getElementById('mTests').textContent=`${s.passed??'—'}/${s.total??'—'}`;
  document.getElementById('mCode').textContent=s.code||'(no code saved)';
  document.getElementById('detailModal').classList.add('open');
}
document.querySelectorAll('.sfil').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.sfil').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeS=b.dataset.s;render();}));
document.getElementById('searchBox').addEventListener('input',render);
document.getElementById('detailModal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
