<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Debugg — Discuss</title>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
    .cat{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:'Cabinet Grotesk',sans-serif;transition:all var(--t-fast)}
    .cat.active,.cat:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,245,255,.05)}
    .post-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:20px 22px;margin-bottom:14px;cursor:pointer;transition:all var(--t-fast)}
    .post-card:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,245,255,.06)}
    .post-card-top{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}
    .post-av{width:34px;height:34px;border-radius:50%;background:var(--grad-pink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0;font-family:'Clash Display',sans-serif}
    .post-meta{flex:1}
    .post-author{font-size:13px;font-weight:700;color:var(--cyan)}
    .post-time{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
    .post-title{font-family:'Clash Display',sans-serif;font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.3}
    .post-body{font-size:13px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .post-foot{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
    .cat-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(0,245,255,.07);color:var(--cyan);border:1px solid rgba(0,245,255,.2)}
    .post-stat{font-size:12px;color:var(--text3)}
    .upvote-btn{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:'Cabinet Grotesk',sans-serif;transition:color var(--t-fast);padding:0;display:flex;align-items:center;gap:4px}
    .upvote-btn:hover,.upvote-btn.voted{color:var(--cyan)}
    .empty-msg{padding:48px;text-align:center;color:var(--text3);font-size:14px}
    /* Thread modal */
    .thread-body{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:18px;white-space:pre-wrap}
    .thread-divider{border:none;border-top:1px solid var(--border);margin:16px 0}
    .rep-list{}
    .rep-item{display:flex;gap:10px;margin-bottom:14px}
    .rep-av{width:30px;height:30px;border-radius:50%;background:var(--grad-accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#050508;flex-shrink:0;font-family:'Clash Display',sans-serif}
    .rep-content{flex:1}
    .rep-meta{font-size:11px;color:var(--text3);margin-bottom:3px}
    .rep-meta strong{color:var(--cyan)}
    .rep-text{font-size:14px;line-height:1.6;white-space:pre-wrap}
    .rep-form{display:flex;gap:8px;margin-top:12px}
    .rep-inp{flex:1;padding:9px 12px;border-radius:var(--r-md);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:13px;outline:none;font-family:'Cabinet Grotesk',sans-serif}
    .rep-inp:focus{border-color:var(--cyan)}
    .rep-send{padding:9px 16px;border-radius:var(--r-md);border:none;background:var(--grad-accent);color:#050508;font-size:13px;font-weight:700;cursor:pointer;font-family:'Cabinet Grotesk',sans-serif}
  </style>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="dashboard.html">Debugg</a>
  <a class="nav-link" href="dashboard.html">Problems</a>
  <a class="nav-link" href="submissions.html">Submissions</a>
  <a class="nav-link active" href="discuss.html">Discuss</a>
  <a class="nav-link" href="playground.html">Playground</a>
  <div class="nav-spacer"></div>
  <button class="nav-icon-btn theme-btn" id="themeBtn">☀️</button>
  <a class="nav-avatar" href="profile.html" id="avatarBtn">D</a>
</nav>
<div class="page-wrap">
  <div class="page-head fade-up">
    <div class="section-title" style="margin-bottom:0">Community Discuss</div>
    <button class="btn btn-primary" id="newPostBtn">+ New Post</button>
  </div>
  <div class="cats fade-up fade-up-1">
    <button class="cat active" data-c="All">All</button>
    <button class="cat" data-c="Tips">Tips & Tricks</button>
    <button class="cat" data-c="Experience">Experience</button>
    <button class="cat" data-c="Question">Questions</button>
    <button class="cat" data-c="Resource">Resources</button>
  </div>
  <div id="postsList" class="fade-up fade-up-2"><div class="empty-msg"><span class="spinner"></span></div></div>
</div>
<!-- New Post Modal -->
<div class="modal-backdrop" id="newModal">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('newModal').classList.remove('open')">✕</button>
    <h2 class="modal-title">New Post</h2>
    <div class="field-group"><label class="field-label">Title</label><input type="text" id="pTitle" class="field-input" placeholder="Share a tip, experience, or question…" maxlength="120"/></div>
    <div class="field-group"><label class="field-label">Category</label>
      <select id="pCat" class="field-select"><option value="Tips">Tips & Tricks</option><option value="Experience">Experience</option><option value="Question">Questions</option><option value="Resource">Resources</option></select>
    </div>
    <div class="field-group"><label class="field-label">Content</label><textarea id="pBody" class="field-textarea" rows="6" placeholder="Write your post here…"></textarea></div>
    <button class="btn btn-primary" style="width:100%;margin-top:4px" id="pubBtn">Publish Post</button>
  </div>
</div>
<!-- Thread Modal -->
<div class="modal-backdrop" id="threadModal">
  <div class="modal modal-wide">
    <button class="modal-close" onclick="document.getElementById('threadModal').classList.remove('open')">✕</button>
    <h2 class="modal-title" id="tTitle"></h2>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <span class="post-author" id="tAuthor"></span>
      <span class="post-time" id="tTime"></span>
      <span class="cat-tag" id="tCat"></span>
    </div>
    <div class="thread-body" id="tBody"></div>
    <hr class="thread-divider"/>
    <div style="font-size:13px;font-weight:700;margin-bottom:12px" id="tRepCount">Replies</div>
    <div class="rep-list" id="tReplies"></div>
    <div class="rep-form"><input type="text" class="rep-inp" id="tRepInp" placeholder="Share your thoughts…"/><button class="rep-send" id="tRepBtn">Reply</button></div>
  </div>
</div>
<script type="module">
import{auth,db}from'./firebase-config.js';
import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{collection,addDoc,getDocs,getDoc,doc,updateDoc,query,orderBy,onSnapshot,increment,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import{initTheme,toggleTheme}from'./theme.js';
initTheme();document.getElementById('themeBtn').addEventListener('click',toggleTheme);
let cu=null,activeCat='All',curPost=null;
onAuthStateChanged(auth,u=>{if(!u){window.location.href='index.html';return;}cu=u;document.getElementById('avatarBtn').textContent=(u.displayName||'D').split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();load();});
function load(){
  onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc')),snap=>{
    const items=snap.docs.map(d=>({id:d.id,...d.data()}));
    const f=activeCat==='All'?items:items.filter(p=>p.category===activeCat);
    const list=document.getElementById('postsList');
    if(!f.length){list.innerHTML='<div class="empty-msg">No posts yet. Be the first to share!</div>';return;}
    list.innerHTML=f.map(p=>{
      const ini=(p.authorName||'U').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
      const t=p.createdAt?new Date(p.createdAt.seconds*1000).toLocaleString():'';
      const voted=p.upvotedBy&&cu&&p.upvotedBy.includes(cu.uid);
      return`<div class="post-card" data-id="${p.id}">
        <div class="post-card-top"><div class="post-av">${ini}</div><div class="post-meta"><div class="post-author">${esc(p.authorName||'User')}</div><div class="post-time">${t}</div></div></div>
        <div class="post-title">${esc(p.title)}</div>
        <div class="post-body">${esc(p.body)}</div>
        <div class="post-foot"><span class="cat-tag">${esc(p.category||'General')}</span><span class="post-stat">💬 ${p.replyCount||0}</span><button class="upvote-btn${voted?' voted':''}" data-id="${p.id}">▲ ${p.upvotes||0}</button></div>
      </div>`;
    }).join('');
    document.querySelectorAll('.post-card').forEach(c=>{
      c.addEventListener('click',e=>{if(e.target.classList.contains('upvote-btn'))return;openThread(c.dataset.id);});
    });
    document.querySelectorAll('.upvote-btn').forEach(b=>{
      b.addEventListener('click',async e=>{e.stopPropagation();if(!cu)return;const r=doc(db,'posts',b.dataset.id);const s=await getDoc(r);if(!s.exists())return;const v=s.data().upvotedBy||[];if(v.includes(cu.uid))return;await updateDoc(r,{upvotes:increment(1),upvotedBy:[...v,cu.uid]});});
    });
  });
}
async function openThread(id){
  curPost=id;const s=await getDoc(doc(db,'posts',id));if(!s.exists())return;const p=s.data();
  document.getElementById('tTitle').textContent=p.title;
  document.getElementById('tAuthor').textContent=p.authorName||'User';
  document.getElementById('tTime').textContent=p.createdAt?new Date(p.createdAt.seconds*1000).toLocaleString():'';
  document.getElementById('tCat').textContent=p.category||'General';
  document.getElementById('tBody').textContent=p.body;
  document.getElementById('threadModal').classList.add('open');
  loadReplies(id);
}
async function loadReplies(id){
  const snap=await getDocs(query(collection(db,'posts',id,'replies'),orderBy('createdAt','asc')));
  document.getElementById('tRepCount').textContent=`${snap.size} Repl${snap.size===1?'y':'ies'}`;
  document.getElementById('tReplies').innerHTML=!snap.size?'<div style="color:var(--text3);font-size:13px;margin-bottom:10px">No replies yet.</div>':
    snap.docs.map(d=>{const r=d.data();const ini=(r.authorName||'U').split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();const t=r.createdAt?new Date(r.createdAt.seconds*1000).toLocaleString():'';
    return`<div class="rep-item"><div class="rep-av">${ini}</div><div class="rep-content"><div class="rep-meta"><strong>${esc(r.authorName||'User')}</strong> · ${t}</div><div class="rep-text">${esc(r.text)}</div></div></div>`;}).join('');
}
document.getElementById('tRepBtn').addEventListener('click',async()=>{
  if(!curPost||!cu)return;const inp=document.getElementById('tRepInp');const t=inp.value.trim();if(!t)return;inp.value='';
  await addDoc(collection(db,'posts',curPost,'replies'),{text:t,authorId:cu.uid,authorName:cu.displayName||'User',createdAt:serverTimestamp()});
  await updateDoc(doc(db,'posts',curPost),{replyCount:increment(1)});loadReplies(curPost);
});
document.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.c;load();}));
document.getElementById('newPostBtn').addEventListener('click',()=>document.getElementById('newModal').classList.add('open'));
document.getElementById('pubBtn').addEventListener('click',async()=>{
  const t=document.getElementById('pTitle').value.trim(),b=document.getElementById('pBody').value.trim();
  if(!t||!b){alert('Fill title and content.');return;}
  const btn=document.getElementById('pubBtn');btn.textContent='Publishing…';btn.disabled=true;
  try{await addDoc(collection(db,'posts'),{title:t,body:b,category:document.getElementById('pCat').value,authorId:cu.uid,authorName:cu.displayName||'User',upvotes:0,upvotedBy:[],replyCount:0,createdAt:serverTimestamp()});
  document.getElementById('pTitle').value='';document.getElementById('pBody').value='';document.getElementById('newModal').classList.remove('open');}
  catch(e){alert('Failed: '+e.message);}finally{btn.textContent='Publish Post';btn.disabled=false;}
});
[document.getElementById('newModal'),document.getElementById('threadModal')].forEach(m=>m.addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');}));
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
