<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Debugg — Profile</title>
<link rel="stylesheet" href="shared.css"/>
  <style>
    .profile-top{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;margin-bottom:32px;flex-wrap:wrap}
    .big-avatar{width:90px;height:90px;border-radius:50%;background:var(--grad-pink);display:flex;align-items:center;justify-content:center;font-family:'Clash Display',sans-serif;font-size:32px;font-weight:700;color:white;flex-shrink:0;border:2px solid rgba(244,114,182,.3)}
    .pname{font-family:'Clash Display',sans-serif;font-size:28px;font-weight:700;margin-bottom:4px}
    .pemail{font-size:14px;color:var(--text2);margin-bottom:5px}
    .pjoined{font-size:12px;color:var(--text3)}
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 16px;transition:border-color var(--t-fast)}
    .stat-card:hover{border-color:var(--border2)}
    .stat-card .val{font-family:'Clash Display',sans-serif;font-size:28px;font-weight:700}
    .stat-card .lbl{font-size:12px;color:var(--text3);margin-top:3px;font-weight:600}
    .val-fire{color:var(--orange)}.val-green{color:var(--easy-color)}.val-violet{color:var(--violet)}.val-cyan{background:var(--grad-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .prof-tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:3px;width:fit-content;margin-bottom:20px}
    .ptab{padding:7px 16px;border-radius:var(--r-sm);border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:'Cabinet Grotesk',sans-serif;transition:all var(--t-fast)}
    .ptab.active{background:var(--surface2);color:var(--text)}
    .list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden}
    .list-row{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);font-size:14px;text-decoration:none;color:var(--text);transition:background var(--t-fast)}
    .list-row:last-child{border-bottom:none}
    .list-row:hover{background:var(--surface2)}
    .list-row .row-title{font-weight:600}
    .list-row .row-date{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace}
    .upload-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border)}
    .upload-row:last-child{border-bottom:none}
    .upload-title{font-size:14px;font-weight:600}
    .upload-count{font-size:12px;color:var(--text3)}
    .empty-msg{padding:32px;text-align:center;color:var(--text3);font-size:14px}
    @media(max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr)}.profile-top{grid-template-columns:auto 1fr;gap:16px}.profile-top>:last-child{grid-column:1/-1}}
  </style>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="dashboard.html">Debugg</a>
  <a class="nav-link" href="dashboard.html">Problems</a>
  <a class="nav-link" href="submissions.html">Submissions</a>
  <a class="nav-link" href="discuss.html">Discuss</a>
  <a class="nav-link" href="playground.html">Playground</a>
  <div class="nav-spacer"></div>
  <button class="nav-icon-btn theme-btn" id="themeBtn">☀️</button>
  <button class="btn btn-danger btn-sm" id="signOutBtn">Sign out</button>
</nav>
<div class="page-wrap">
  <div class="profile-top fade-up">
    <div class="big-avatar" id="avatarEl">D</div>
    <div>
      <div class="pname" id="pName">Loading…</div>
      <div class="pemail" id="pEmail"></div>
      <div class="pjoined" id="pJoined"></div>
    </div>
    <a class="btn btn-ghost btn-sm" href="playground.html">Open Playground →</a>
  </div>
  <div class="stats-row fade-up fade-up-1">
    <div class="stat-card"><div class="val val-fire" id="stStreak">0</div><div class="lbl">🔥 Day Streak</div></div>
    <div class="stat-card"><div class="val val-green" id="stSolved">0</div><div class="lbl">Solved</div></div>
    <div class="stat-card"><div class="val val-violet" id="stUploads">0</div><div class="lbl">Uploaded</div></div>
    <div class="stat-card"><div class="val val-cyan" id="stSubs">0</div><div class="lbl">Submissions</div></div>
  </div>
  <div class="prof-tabs fade-up fade-up-2">
    <button class="ptab active" data-t="solved">Solved Problems</button>
    <button class="ptab" data-t="uploads">My Uploads</button>
  </div>
  <div id="solvedTab" class="fade-up fade-up-3">
    <div class="list-card" id="solvedList"><div class="empty-msg"><span class="spinner"></span></div></div>
  </div>
  <div id="uploadsTab" style="display:none" class="fade-up fade-up-3">
    <div class="list-card" id="uploadsList"><div class="empty-msg"><span class="spinner"></span></div></div>
  </div>
</div>
<script type="module">
import{auth,db}from'./firebase-config.js';
import{onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{doc,getDoc,collection,getDocs,query,where,orderBy}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import{initTheme,toggleTheme}from'./theme.js';
initTheme();document.getElementById('themeBtn').addEventListener('click',toggleTheme);

onAuthStateChanged(auth,async user=>{
  if(!user){window.location.href='index.html';return;}
  const ini=(user.displayName||'D').split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('avatarEl').textContent=ini;
  document.getElementById('pName').textContent=user.displayName||'Debugger';
  document.getElementById('pEmail').textContent=user.email;

  try{
    const snap=await getDoc(doc(db,'users',user.uid));
    if(snap.exists()){
      const d=snap.data();
      document.getElementById('stStreak').textContent=d.streak||0;
      document.getElementById('stSolved').textContent=d.solved||0;
      document.getElementById('stUploads').textContent=d.uploads||0;
      if(d.createdAt) document.getElementById('pJoined').textContent='Joined '+d.createdAt.toDate().toLocaleDateString('en-US',{month:'long',year:'numeric'});
    }
  }catch(e){}

  // Submission count
  try{const s=await getDocs(collection(db,'users',user.uid,'submissions'));document.getElementById('stSubs').textContent=s.size;}catch(e){}

  // Solved list
  try{
    const s=await getDocs(collection(db,'users',user.uid,'solved'));
    const items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.solvedAt?.seconds||0)-(a.solvedAt?.seconds||0));
    const el=document.getElementById('solvedList');
    if(!items.length){el.innerHTML='<div class="empty-msg">No problems solved yet. Start debugging!</div>';}
    else el.innerHTML=items.map(it=>`<a class="list-row" href="solve.html?id=${it.id}"><span class="row-title">✅ ${esc(it.problemTitle||it.id)}</span><span>${it.difficulty?`<span class="badge badge-${(it.difficulty||'').toLowerCase()}">${it.difficulty}</span>`:''}</span><span class="row-date">${it.solvedAt?new Date(it.solvedAt.seconds*1000).toLocaleDateString():''}</span></a>`).join('');
  }catch(e){document.getElementById('solvedList').innerHTML='<div class="empty-msg">Could not load.</div>';}

  // Uploads
  try{
    const s=await getDocs(query(collection(db,'problems'),where('authorId','==',user.uid)));
    const items=s.docs.map(d=>({id:d.id,...d.data()}));
    const el=document.getElementById('uploadsList');
    if(!items.length){el.innerHTML='<div class="empty-msg">You haven\'t uploaded any challenges yet.</div>';}
    else el.innerHTML=items.map(p=>`<div class="upload-row"><div><div class="upload-title"><a href="solve.html?id=${p.id}" style="color:var(--text);text-decoration:none">${esc(p.title)}</a></div><div class="upload-count">${p.solvedCount||0} solver${p.solvedCount===1?'':'s'}</div></div><span class="badge badge-${(p.difficulty||'').toLowerCase()}">${p.difficulty}</span><span class="badge badge-lang">${p.language}</span></div>`).join('');
  }catch(e){document.getElementById('uploadsList').innerHTML='<div class="empty-msg">Could not load.</div>';}
});

document.querySelectorAll('.ptab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  document.getElementById('solvedTab').style.display=b.dataset.t==='solved'?'':'none';
  document.getElementById('uploadsTab').style.display=b.dataset.t==='uploads'?'':'none';
}));

document.getElementById('signOutBtn').addEventListener('click',async()=>{await signOut(auth);window.location.href='index.html';});
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
